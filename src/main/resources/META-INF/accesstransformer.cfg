# Screen#addRenderableWidget is protected, so an addon cannot attach a widget to another mod's
# screen from outside its package. Widening it lets the auto-solve button live in the same
# renderable/child lists as Relics' own hint button, which is what makes it render, hover, tick
# and click through exactly the same passes as the rest of that screen.
public net.minecraft.client.gui.screens.Screen addRenderableWidget(Lnet/minecraft/client/gui/components/events/GuiEventListener;)Lnet/minecraft/client/gui/components/events/GuiEventListener;

# CreateWorldScreen is the only class in the game that overrides it, and Java forbids an override
# from being less visible than the method it overrides. Without this line Minecraft itself fails
# to recompile with "attempting to assign weaker access privileges".
public net.minecraft.client.gui.screens.worldselection.CreateWorldScreen addRenderableWidget(Lnet/minecraft/client/gui/components/events/GuiEventListener;)Lnet/minecraft/client/gui/components/events/GuiEventListener;
