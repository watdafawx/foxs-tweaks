plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically.
    // It widens Screen#addRenderableWidget so the button can be attached to
    // Relics' research screen from outside its package.

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()

    // Shadows-of-Fire's own maven - Apotheosis, Placebo, ApothicAttributes.
    maven { url "https://maven.shadowsoffire.dev/releases" }

    // TheIllusiveC4's own maven - Curios.
    maven { url "https://maven.theillusivec4.top/" }

    // Architectury's own maven, scoped so it isn't asked to resolve anything else.
    maven {
        url "https://maven.architectury.dev"
        content { includeGroup "dev.architectury" }
    }

    // Modrinth mirrors every mod hosted there as a Maven repo (group "maven.modrinth", artifact is
    // the slug, version is the Modrinth *version id*, not the version number). Relics and OctoLib
    // have no maven of their own, so this is the only way to resolve them without a manual jar.
    // Scoped for the same reason as Architectury's.
    maven {
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    // All optional parent-mod integrations. compileOnly: none of these may leak into the shipped
    // jar's dependency requirements (see neoforge.mods.toml, which lists relics/apotheosis as
    // "optional" by hand) - at runtime the real mods, if installed, are what's actually loaded.
    //
    // This only covers compiling. FML's mod discovery (mixins, mods.toml, the lot) scans run/mods -
    // not the general runtime classpath - so ModDevGradle's additionalRuntimeClasspath does not make
    // these load as mods in the dev client (it is meant for plain non-mod libraries); a real test run
    // still needs the matching jars dropped into run/mods by hand. See Local setup in AGENTS.md.
    compileOnly "dev.shadowsoffire:Apotheosis:${minecraft_version}-${apotheosis_version}"
    compileOnly "dev.shadowsoffire:Placebo:${minecraft_version}-${placebo_version}"
    compileOnly "dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothic_attributes_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "maven.modrinth:relics-mod:${relics_version}"
    compileOnly "maven.modrinth:shatterbyte-lib:${octolib_version}" // OctoLib; "shatterbyte-lib" is its Modrinth slug.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            mod_id       : mod_id,
            mod_name     : mod_name,
            mod_version  : mod_version,
            mod_license  : mod_license,
            mod_authors  : mod_authors,
            neo_version  : neo_version
    ]

    inputs.properties(expandProps)

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
