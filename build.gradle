plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Hopper/GitHub Release naming: <modid>-<version>+neoforge-<mc>.jar. project.version stays plain
// because it is expanded into neoforge.mods.toml.
tasks.withType(Jar).configureEach {
    archiveVersion = "${project.version}+neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically.
    // It widens Screen#addRenderableWidget so the button can be attached to
    // Relics' research screen from outside its package.

    runs {
        client {
            client()
            gameDirectory = file('run')
        }

        // Low-memory client for UI-only checks: own game dir (run-lite/, gitignored), 1 GB heap.
        // Put just the mods under test in run-lite/mods.
        clientLite {
            client()
            gameDirectory = file('run-lite')
            jvmArguments.addAll('-Xms256M', '-Xmx1G', '-XX:+UseSerialGC')
            programArguments.addAll('--quickPlaySingleplayer', 'New World')
        }

        // Dev-only parity check for the TACZ model fast path (client/dev/TaczModelCheck): draws every TACZ
        // model cube both ways, writes run-tacz/foxstweaks-tacz-check.txt and quits. Put the TACZ jar in
        // run-tacz/mods first.
        taczCheck {
            client()
            gameDirectory = file('run-tacz')
            systemProperty 'foxstweaks.taczCheck', 'true'
        }

        // Dev-only check for EMI Slim (client/dev/EmiSlimCheck): flat world, sharing + change-isolation checks,
        // writes run-emi/foxstweaks-emislim-check.txt and quits. Put the EMI jar in run-emi/mods first.
        emiSlimCheck {
            client()
            gameDirectory = file('run-emi')
            systemProperty 'foxstweaks.emiSlimCheck', 'true'
        }

        // Dev-only check of the search box assist (client/dev/SearchAssistCheck): types into real EditBoxes on the
        // title screen, writes run-search/foxstweaks-search-check.txt and quits. No extra mods needed.
        searchAssistCheck {
            client()
            gameDirectory = file('run-search')
            systemProperty 'foxstweaks.searchAssistCheck', 'true'
        }

        // Search assist inside EMI (client/dev/SearchAssistModsCheck): put the jar (AE2: plus guideme) in run-search-emi/mods.
        runSearchEmiCheck {
            client()
            gameDirectory = file('run-search-emi')
            systemProperty 'foxstweaks.searchModsCheck', 'emi'
        }

        // Search assist inside JEI (client/dev/SearchAssistModsCheck): put the jar (AE2: plus guideme) in run-search-jei/mods.
        runSearchJeiCheck {
            client()
            gameDirectory = file('run-search-jei')
            systemProperty 'foxstweaks.searchModsCheck', 'jei'
        }

        // Search assist inside AE2 (client/dev/SearchAssistModsCheck): put the jar (AE2: plus guideme) in run-search-ae2/mods.
        runSearchAe2Check {
            client()
            gameDirectory = file('run-search-ae2')
            systemProperty 'foxstweaks.searchModsCheck', 'ae2'
        }

        // Dev-only check of the Kaleidoscope Grilling skewer cache (client/dev/GrillingCheck): flat world, parity +
        // timing, writes run-grilling/foxstweaks-grilling-check.txt and quits. Put kaleidoscope_grilling and
        // kaleidoscope_cookery jars in run-grilling/mods first.
        grillingCheck {
            client()
            gameDirectory = file('run-grilling')
            systemProperty 'foxstweaks.grillingCheck', 'true'
        }

        // Dev-only check of the attribute dial (client/dev/AttributeDialCheck): flat world, fake gear, drives the real
        // screen, proves the values on the server player, writes run-attribute-dial/foxstweaks-attributedial-check.txt
        // + screenshots and quits. No extra mods needed.
        attributeDialCheck {
            client()
            gameDirectory = file('run-attribute-dial')
            systemProperty 'foxstweaks.attributeDialCheck', 'true'
        }

        // Dev-only check of the Shrink hotkey + settings key (client/dev/ShrinkCheck): flat world, presses the real
        // keys (inventory + Curios slot), screenshots the settings screen, writes run-shrink/foxstweaks-shrink-check.txt
        // and quits. Put shrink, architectury, polylib and curios jars in run-shrink/mods first.
        shrinkCheck {
            client()
            gameDirectory = file('run-shrink')
            systemProperty 'foxstweaks.shrinkCheck', 'true'
        }

        // Dev-only screenshot of the Relics auto-level toggle (client/dev/RelicsShot): shots land in
        // run-relics/. Needs relics, curios, OctoLib, architectury jars in run-relics/mods.
        relicsShot {
            client()
            gameDirectory = file('run-relics')
            systemProperty 'foxstweaks.relicsShot', 'true'
        }

        // Dev-only check of the overworld-copy portals (client/dev/PortalShot): flat world, lights a frame,
        // rides it there and back, dyes it. Report + screenshots land in run-portal/. No extra mods needed.
        portalShot {
            client()
            gameDirectory = file('run-portal')
            systemProperty 'foxstweaks.portalShot', 'true'
        }

        // Dev-only check of the enchantment/affix toggle overlay (client/dev/ToggleShot): report + screenshots
        // land in run-toggle/. Put Apotheosis, ApothicAttributes and Placebo in run-toggle/mods for affixes.
        toggleShot {
            client()
            gameDirectory = file('run-toggle')
            systemProperty 'foxstweaks.toggleShot', 'true'
        }

        // Dev-only check + screenshots of the Tab performance overlay and mini-HUD (client/dev/PerfShot):
        // report + screenshots land in run-perf/. No extra mods needed.
        perfShot {
            client()
            gameDirectory = file('run-perf')
            systemProperty 'foxstweaks.perfShot', 'true'
        }

        // Dev-only end-to-end check of the FPS hotspot tools (client/dev/FpsCheck): chests + armor stands, scan,
        // report screen, look / teleport / show / ignore. Report + screenshots land in run-fps/. No extra mods needed.
        fpsCheck {
            client()
            gameDirectory = file('run-fps')
            systemProperty 'foxstweaks.fpsCheck', 'true'
        }

        // Dev-only end-to-end check of virtual spawn anchors (client/dev/AnchorCheck):
        // report lands in run-anchor/. No extra mods needed.
        anchorCheck {
            client()
            gameDirectory = file('run-anchor')
            systemProperty 'foxstweaks.anchorCheck', 'true'
        }

        // Dev-only end-to-end check of holograms (client/dev/HologramCheck): creates, edits through the
        // real editor, saves and deletes, then covers ae2:controller if AE2 is present.
        // Report + screenshot land in run-hologram/.
        hologramAssetCheck {
            client()
            gameDirectory = file('run-hologram-asset')
            systemProperty 'foxstweaks.hologramAssetCheck', 'true'
        }

        hologramEntityAnimCheck {
            client()
            gameDirectory = file('run-hologram-entity-anim')
            systemProperty 'foxstweaks.hologramEntityAnimCheck', 'true'
        }

        hologramCheck {
            client()
            gameDirectory = file('run-hologram')
            systemProperty 'foxstweaks.hologramCheck', 'true'
        }

        // Dev-only check of the simple hologram editor (client/dev/HologramCreatorCheck): presses its real
        // controls, switches to the Studio and back, saves. Report + screenshots land in run-hologram-creator/.
        hologramCreatorCheck {
            client()
            gameDirectory = file('run-hologram-creator')
            systemProperty 'foxstweaks.hologramCreatorCheck', 'true'
        }

        // Dev-only check of player-attached holograms (client/dev/HologramAttachCheck): attach, 1st-person hide,
        // 3rd-person render + tracking, follow modes, Overworld->Nether travel, detach.
        hologramAttachCheck {
            client()
            gameDirectory = file('run-hologram-attach')
            systemProperty 'foxstweaks.hologramAttachCheck', 'true'
        }

        // Dev-only check of music-reactive holograms (client/dev/HologramAudioCheck): generated tones and a click
        // track through the analyser and a fake capture device, modulations, presets, the panels, save, caps.
        // Report + screenshots land in run-hologram-audio/.
        hologramAudioCheck {
            client()
            gameDirectory = file('run-hologram-audio')
            systemProperty 'foxstweaks.hologramAudioCheck', 'true'
        }

        // Dev-only check of the hologram web companion (client/dev/HologramWebCheck): Web buttons, HTTP token /
        // Host / traversal, a real WebSocket client speaking the protocol, save, shutdown. Report in run-hologram-web/.
        hologramWebCheck {
            client()
            gameDirectory = file('run-hologram-web')
            systemProperty 'foxstweaks.hologramWebCheck', 'true'
        }

        // Dev-only check of IMAGE hologram layers (client/dev/HologramImageCheck): uploads over the web protocol,
        // layers, save, clock, billboard, timeline scale, caps, benchmark. Report in run-hologram-image/.
        hologramImageCheck {
            client()
            gameDirectory = file('run-hologram-image')
            systemProperty 'foxstweaks.hologramImageCheck', 'true'
        }

        // Dev-only check of MODEL hologram layers (client/dev/HologramModelCheck): bbmodel + glb uploads, refusal of
        // junk, client decode, drawing and animation. Report in run-hologram-model/.
        hologramModelCheck {
            client()
            gameDirectory = file('run-hologram-model')
            systemProperty 'foxstweaks.hologramModelCheck', 'true'
        }

        // Dev-only interactive QA driver (client/dev/HologramQaDev): flat world, then runs one-line commands from
        // run-hologram-qa/qa-cmd.txt until told to quit. Put iris/sodium in run-hologram-qa/mods for shader QA.
        hologramQa {
            client()
            gameDirectory = file('run-hologram-qa')
            systemProperty 'foxstweaks.hologramQa', 'true'
        }

        // Dev-only end-to-end check of hologram Grab Mode & entity NBT rendering (client/dev/HologramGrabCheck).
        // Report + screenshots land in run-hologram-grab/.
        hologramGrabCheck {
            client()
            gameDirectory = file('run-hologram-grab')
            systemProperty 'foxstweaks.hologramGrabCheck', 'true'
        }

        // Dev-only end-to-end check & benchmark of hologram structure grab (client/dev/HologramStructureCheck).
        // Report + screenshots land in run-hologram-structure/.
        hologramStructureCheck {
            client()
            gameDirectory = file('run-hologram-structure')
            systemProperty 'foxstweaks.hologramStructureCheck', 'true'
        }

        // Dev-only check of the hologram asset browser (client/dev/HologramPickerCheck): opens it from the editor,
        // drives search, chips, favourites, variants, Replace / Add layer. Report + screenshots land in
        // run-hologram-picker/ (screenshots/ subfolder). No extra mods needed.
        hologramPickerCheck {
            client()
            gameDirectory = file('run-hologram-picker')
            systemProperty 'foxstweaks.hologramPickerCheck', 'true'
        }

        // Dev-only check that an anchor carries its owner's Apotheosis world tier (client/dev/AnchorTierCheck):
        // report lands in run-anchor-tier/. Put Apotheosis, ApothicAttributes and Placebo in run-anchor-tier/mods.
        // -PtierOff runs it with the tier path switched off, which must fail the tier assertions.
        // -PfakeBreak makes the startup probe report a broken hook, to prove the warning is shown.
        anchorTierCheck {
            client()
            gameDirectory = file('run-anchor-tier')
            systemProperty 'foxstweaks.anchorTierCheck', 'true'
            if (project.hasProperty('tierOff')) {
                systemProperty 'foxstweaks.anchorTier.off', 'true'
            }
            if (project.hasProperty('fakeBreak')) {
                systemProperty 'foxstweaks.anchorTier.fakeBreak', 'true'
            }
        }

        // Dev-only check of the settings screen's sections (client/dev/ConfigScreenCheck):
        // report and screenshots land in run-config/. No extra mods needed.
        configCheck {
            client()
            gameDirectory = file('run-config')
            systemProperty 'foxstweaks.configCheck', 'true'
        }

        // Headless: enough to load datapacks and read the log, e.g. to check what the affix patcher did.
        // Needs the same hand-placed jars as the client, in run-server/mods.
        server {
            server()
            gameDirectory = file('run-server')
        }

        // Dev-only check of the Taverns & Adventurers locate guard (dev/RumorLocateCheck): headless, game dir
        // run-rumor/ (the Taverns jar in run-rumor/mods), writes run-rumor/foxstweaks-rumor-check.txt and stops.
        rumorCheck {
            server()
            gameDirectory = file('run-rumor')
            systemProperty 'foxstweaks.rumorCheck', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()

    // Shadows-of-Fire's own maven - Apotheosis, Placebo, ApothicAttributes.
    maven { url "https://maven.shadowsoffire.dev/releases" }

    // TheIllusiveC4's own maven - Curios.
    maven { url "https://maven.theillusivec4.top/" }

    // Architectury's own maven, scoped so it isn't asked to resolve anything else.
    maven {
        url "https://maven.architectury.dev"
        content { includeGroup "dev.architectury" }
    }

    // Modrinth mirrors every mod hosted there as a Maven repo (group "maven.modrinth", artifact is
    // the slug, version is the Modrinth *version id*, not the version number). Relics and OctoLib
    // have no maven of their own, so this is the only way to resolve them without a manual jar.
    // Scoped for the same reason as Architectury's.
    maven {
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }

    // FTB's own maven - FTB Library, for its sidebar button API.
    maven {
        url "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }

    // MixinSquared, bundled (jar-in-jar) for StaleMixinCanceller.
    maven {
        url "https://maven.bawnorton.com/releases"
        content { includeGroup "com.github.bawnorton.mixinsquared" }
    }
}

dependencies {
    // All optional parent-mod integrations. compileOnly: none of these may leak into the shipped
    // jar's dependency requirements (see neoforge.mods.toml, which lists relics/apotheosis as
    // "optional" by hand) - at runtime the real mods, if installed, are what's actually loaded.
    //
    // This only covers compiling. FML's mod discovery (mixins, mods.toml, the lot) scans run/mods -
    // not the general runtime classpath - so ModDevGradle's additionalRuntimeClasspath does not make
    // these load as mods in the dev client (it is meant for plain non-mod libraries); a real test run
    // still needs the matching jars dropped into run/mods by hand. See Local setup in AGENTS.md.
    compileOnly "dev.shadowsoffire:Apotheosis:${minecraft_version}-${apotheosis_version}"
    compileOnly "dev.shadowsoffire:Placebo:${minecraft_version}-${placebo_version}"
    compileOnly "dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothic_attributes_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "maven.modrinth:relics-mod:${relics_version}"
    compileOnly "maven.modrinth:shatterbyte-lib:${octolib_version}" // OctoLib; "shatterbyte-lib" is its Modrinth slug.
    compileOnly "maven.modrinth:vics-point-blank:${pointblank_version}"
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    compileOnly "maven.modrinth:emi:${emi_version}"
    compileOnly "maven.modrinth:iris:${iris_version}"
    compileOnly "maven.modrinth:ars-nouveau:${ars_nouveau_version}"
    compileOnly "maven.modrinth:botany-pots:${botanypots_version}"
    compileOnly "dev.shadowsoffire:HostileNeuralNetworks:${minecraft_version}-${hnn_version}"
    // Inventory Profiles Next (Kotlin) + its library. kotlin-stdlib only so javac can see the Kotlin
    // types (Function0, DefaultConstructorMarker) that appear in IPN's class signatures.
    compileOnly "maven.modrinth:inventory-profiles-next:${ipn_version}"
    compileOnly "maven.modrinth:libipn:${libipn_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"

    // The one real dependency, shipped inside our jar: lets StaleMixinCanceller switch off other
    // mods' mixins that broke when the mod they patch updated. The neoforge artifact is the
    // bootstrap (it nests the common jar); the common jar is only needed to compile against the API.
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixinsquared_version}"))
    compileOnly "com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"
}

// Headless self-test of the video import (media/dev/VideoConverterSelfTest): plain Java, no game window.
// It checks the ffmpeg locator and, when ffmpeg is installed, converts a generated 3 s testsrc video,
// asserts the container gate and the timeout. Without ffmpeg the conversion cases print SKIP.
tasks.register('mediaSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the video import self-test (ffmpeg locator, conversion caps, container gate, timeout).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.watdafawx.foxstweaks.media.dev.VideoConverterSelfTest'
}

tasks.register('modelSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the 3D model self-test (glb + Blockbench readers, FTM1 round trip, pose maths).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.watdafawx.foxstweaks.hologram.model.dev.ModelSelfTest'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            mod_id       : mod_id,
            mod_name     : mod_name,
            mod_version  : mod_version,
            mod_license  : mod_license,
            mod_authors  : mod_authors,
            neo_version  : neo_version
    ]

    inputs.properties(expandProps)

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
