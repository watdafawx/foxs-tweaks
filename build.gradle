plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically.
    // It widens Screen#addRenderableWidget so the button can be attached to
    // Relics' research screen from outside its package.

    runs {
        client {
            client()

            // Relics and its dependency chain are dropped into run/mods as normal mod jars
            // rather than put on the classpath, so the dev client loads them the same way a
            // real install would (mixins, access transformers and all).
            gameDirectory = file('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Relics is not published to a public Maven repository, so its jar (and the
    // two mods it needs for its own class hierarchy to resolve) are consumed as
    // local files. compileOnly: at runtime the real mods are already loaded.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            mod_id       : mod_id,
            mod_name     : mod_name,
            mod_version  : mod_version,
            mod_license  : mod_license,
            mod_authors  : mod_authors,
            neo_version  : neo_version
    ]

    inputs.properties(expandProps)

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
