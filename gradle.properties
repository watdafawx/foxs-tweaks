org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

neo_version=21.1.248
minecraft_version=1.21.1

# compileOnly versions for the optional parent mods - see the "dependencies" block in build.gradle
# for where each one is resolved from. None of these are bundled or required; they only need to
# exist for compilation and for the dev client run to have something to load.
relics_version=WKEe9sPL
curios_version=9.5.1+1.21.1
octolib_version=yVCCi6TK
apotheosis_version=8.7.0
placebo_version=9.9.2
apothic_attributes_version=2.10.1
architectury_version=13.0.11

mod_id=foxstweaks
mod_name=Fox's Tweaks
mod_version=1.1.0
mod_group_id=dev.mtop.foxstweaks
mod_license=MIT
mod_authors=mtop

# This machine has AAAA records for the Maven hosts but no working IPv6 route, so the
# JVM stalls on connect until it falls back. Force IPv4 and be patient with slow mirrors.
systemProp.java.net.preferIPv4Stack=true
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
